name: PoC00-B1 Mercur database and HTTP smoke (NO Stripe/AWS)
on:
  # Slow upstream integration: manual-only after a failure to avoid
  # paying GitHub Actions minutes for every PoC commit.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mercur-http-smoke:
    name: Mercur + PostgreSQL + Redis isolated upstream HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mercur
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mercur
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379
      MEDUSA_FF_SELLER_REGISTRATION: 'true'
      MEDUSA_FF_PRODUCT_REQUEST: 'false'
      JWT_SECRET: ci-synthetic-secret-not-for-production
      COOKIE_SECRET: ci-synthetic-cookie-not-for-production
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      VENDOR_CORS: http://localhost:9001
      AUTH_CORS: http://localhost:8000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          path: np
      - uses: actions/checkout@v4
        with:
          repository: mercurjs/mercur
          ref: 9fe557067193e0ad4dd3b7fd37e212f0b352ab3c
          path: mercur
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - name: Verify upstream SHA and DB/Redis live connections
        run: |
          test "$(git -C mercur rev-parse HEAD)" = "9fe557067193e0ad4dd3b7fd37e212f0b352ab3c"
          PGCONT="$(docker ps -q --filter ancestor=postgres:15 | head -1)"
          REDCONT="$(docker ps -q --filter ancestor=redis:7 | head -1)"
          test -n "$PGCONT" && test -n "$REDCONT"
          docker exec "$PGCONT" pg_isready -U postgres
          docker exec "$PGCONT" psql -U postgres -d mercur -Atc 'select 1' | grep -qx '1'
          docker exec "$REDCONT" redis-cli ping | grep -qx PONG
          echo 'PASS: actual temporary PostgreSQL and Redis service connections'
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: mercur-poc-bun-1.3.8-9fe5570
      - name: Install pinned Mercur workspace dependencies
        working-directory: mercur
        run: bun install --frozen-lockfile
      - name: Build pinned Mercur workspace
        working-directory: mercur
        run: bun run build
      - name: Verify Bun Postgres driver TCP connection and test DB privileges
        run: |
          bun np/poc/mercur-runtime/probe-db.mjs
          PGCONT="$(docker ps -q --filter ancestor=postgres:15 | head -1)"
          docker exec "$PGCONT" psql -U postgres -d postgres -Atc "select rolcreatedb from pg_roles where rolname='postgres'" | grep -qx t
      - name: Run Mercur payment webhook HTTP integration (one suite)
        working-directory: mercur/integration-tests
        run: bun run test:integration:http -- --runTestsByPath http/payment/payment-webhook-cart-completion.spec.ts
      - name: Capture DB diagnostics if Mercur tests fail
        if: failure()
        run: |
          PGCONT="$(docker ps -q --filter ancestor=postgres:15 | head -1)"
          docker exec "$PGCONT" psql -U postgres -d postgres -c "select datname, numbackends from pg_stat_database order by numbackends desc limit 12"
          docker exec "$PGCONT" psql -U postgres -d postgres -c "select datname, usename, state, count(*) from pg_stat_activity group by datname,usename,state order by count(*) desc limit 15"
          docker logs --tail 60 "$PGCONT" || true
      - name: Security summary
        if: always()
        run: |
          echo '## PoC00-B1 scope' >> "$GITHUB_STEP_SUMMARY"
          echo 'Pinned upstream Mercur HTTP tests use temporary Postgres/Redis and synthetic secrets.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is NOT Direct charges, NOT Stripe Test Mode, NOT AWS VPC/S3, NOT production-ready.' >> "$GITHUB_STEP_SUMMARY"
