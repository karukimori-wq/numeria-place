name: PoC00-B3-05b Mercur Direct Payment DI and signed HTTP (offline)
on:
  pull_request:
    paths:
      - 'poc/mercur-integration/**'
      - 'poc/mercur-direct/src/numeria-direct-no-transfer-provider.ts'
      - 'poc/mercur-direct/**'
      - '.github/workflows/poc00-b3-mercur-direct-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mercur-direct-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mercur
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mercur
      NP_POC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mercur
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379
      MEDUSA_FF_SELLER_REGISTRATION: 'true'
      MEDUSA_FF_PRODUCT_REQUEST: 'false'
      JWT_SECRET: poc-only-never-production
      COOKIE_SECRET: poc-only-never-production
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      VENDOR_CORS: http://localhost:9001
      AUTH_CORS: http://localhost:8000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          path: np
      - uses: actions/checkout@v4
        with:
          repository: mercurjs/mercur
          ref: 9fe557067193e0ad4dd3b7fd37e212f0b352ab3c
          path: mercur
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify pinned Mercur SHA
        run: test "$(git -C mercur rev-parse HEAD)" = "9fe557067193e0ad4dd3b7fd37e212f0b352ab3c"
      - name: Cache Mercur dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            mercur/node_modules
            mercur/apps/*/node_modules
            mercur/packages/*/node_modules
            mercur/packages/providers/*/node_modules
            mercur/integration-tests/node_modules
          key: poc00-b1-mercurnm-v1-${{ hashFiles('mercur/bun.lock','mercur/bun.lockb') }}
      - name: Install frozen Mercur dependencies if missing
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: mercur
        run: bun install --frozen-lockfile
      - name: Install pinned NP runtime overlay before building changed upstream sources
        run: node np/poc/mercur-integration/scripts/install-direct-runtime.mjs mercur np
      - name: Build patched pinned Mercur workspace
        working-directory: mercur
        run: bun run build
      - name: Install isolated Stripe SDK for NP test provider (offline calls only)
        run: |
          npm install --prefix "$RUNNER_TEMP/np-runtime-deps" --ignore-scripts --no-audit --no-fund stripe@23.0.0 pg@8.16.3 @types/pg@8.15.5 typescript@5.9.3
          mkdir -p mercur/integration-tests/node_modules/@types
          for package in stripe pg typescript @types/pg; do
            rm -rf "mercur/integration-tests/node_modules/$package"
            ln -s "$RUNNER_TEMP/np-runtime-deps/node_modules/$package" "mercur/integration-tests/node_modules/$package"
          done
      - name: Typecheck registered NP Payment provider against pinned Medusa 2.21.2
        working-directory: mercur/integration-tests
        run: node node_modules/typescript/bin/tsc -p tsconfig.np.json
      - name: Test actual Mercur DI, synchronous signed HTTP, DB rollback and pre-write payout hard stop
        working-directory: mercur/integration-tests
        run: bun run test:integration:http -- --runTestsByPath http/np/np-direct-runtime.spec.ts
      - name: Declare strict scope
        if: always()
        run: |
          echo 'B3-05b: patched pinned Mercur build, NP typecheck, real DI/HTTP and isolated NP PostgreSQL tables.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Stripe transport is offline. NP paid tables are NOT Medusa cart/order completion; buyer auth, session issuance, real Stripe and NS delivery remain unverified.' >> "$GITHUB_STEP_SUMMARY"
