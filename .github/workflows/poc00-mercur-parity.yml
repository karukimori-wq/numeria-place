name: PoC00-B1 Mercur parity smoke (upstream build/test separation)
on:
  pull_request:
    paths:
      - '.github/workflows/poc00-mercur-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: poc00-b1-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mercurjs/mercur
          ref: 9fe557067193e0ad4dd3b7fd37e212f0b352ab3c
          path: mercur
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify pinned upstream commit
        run: test "$(git -C mercur rev-parse HEAD)" = "9fe557067193e0ad4dd3b7fd37e212f0b352ab3c"
      - name: Cache upstream dependency symlinks
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            mercur/node_modules
            mercur/apps/*/node_modules
            mercur/packages/*/node_modules
            mercur/packages/providers/*/node_modules
            mercur/integration-tests/node_modules
          key: poc00-b1-mercurnm-v1-${{ hashFiles('mercur/bun.lock','mercur/bun.lockb') }}
      - name: Cache upstream Turborepo build artifacts
        uses: actions/cache@v4
        with:
          path: mercur/.turbo
          key: poc00-b1-mercurturbo-v1-${{ github.sha }}
      - name: Install frozen deps
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: mercur
        run: bun install --frozen-lockfile
      - name: Build upstream Mercur in separate job
        working-directory: mercur
        run: bun run build
  http:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 23
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mercur
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mercur
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379
      MEDUSA_FF_SELLER_REGISTRATION: 'true'
      MEDUSA_FF_PRODUCT_REQUEST: 'false'
      JWT_SECRET: poc-only-never-production
      COOKIE_SECRET: poc-only-never-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mercurjs/mercur
          ref: 9fe557067193e0ad4dd3b7fd37e212f0b352ab3c
          path: mercur
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore pinned node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            mercur/node_modules
            mercur/apps/*/node_modules
            mercur/packages/*/node_modules
            mercur/packages/providers/*/node_modules
            mercur/integration-tests/node_modules
          key: poc00-b1-mercurnm-v1-${{ hashFiles('mercur/bun.lock','mercur/bun.lockb') }}
      - name: Restore pinned Turborepo build artifacts
        uses: actions/cache@v4
        with:
          path: mercur/.turbo
          key: poc00-b1-mercurturbo-v1-${{ github.sha }}
      - name: Verify cache and dependencies
        run: |
          test "${{ steps.node-modules-cache.outputs.cache-hit }}" = 'true'
          test -e mercur/integration-tests/node_modules/jest || test -e mercur/node_modules/jest
      - name: Reuse build cache for downstream package outputs
        working-directory: mercur
        run: bun run build
      - name: Verify PostgreSQL connectivity and test-role privileges
        run: |
          PGCONT="$(docker ps -q --filter ancestor=postgres:15 | head -1)"
          REDCONT="$(docker ps -q --filter ancestor=redis:7 | head -1)"
          docker exec "$PGCONT" psql -U postgres -d mercur -Atc 'select 1' | grep -qx '1'
          docker exec "$PGCONT" psql -U postgres -d postgres -Atc "select rolcreatedb from pg_roles where rolname='postgres'" | grep -qx t
          docker exec "$REDCONT" redis-cli ping | grep -qx PONG
      - name: Run pinned webhook and split-order payments HTTP integration
        working-directory: mercur/integration-tests
        run: bun run test:integration:http -- --runTestsByPath http/payment/payment-webhook-cart-completion.spec.ts http/payment/split-order-payments.spec.ts
      - name: Postgres diagnosis after failure
        if: failure()
        run: |
          PGCONT="$(docker ps -q --filter ancestor=postgres:15 | head -1)"
          docker exec "$PGCONT" psql -U postgres -d postgres -c "select datname,numbackends from pg_stat_database order by numbackends desc limit 10" || true
          docker exec "$PGCONT" psql -U postgres -d postgres -c "select datname,usename,state,count(*) from pg_stat_activity group by 1,2,3 order by 4 desc" || true
      - name: Evidence and scope
        if: always()
        run: |
          echo 'Pinned Mercur 9fe5570 with separate build and HTTP runner; PASS is not Stripe Direct charge verification.' >> "$GITHUB_STEP_SUMMARY"
