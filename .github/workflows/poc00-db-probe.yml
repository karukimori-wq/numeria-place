name: PoC00 PostgreSQL TCP probe (no production resources)
on:
  pull_request:
    paths:
      - 'poc/mercur-runtime/**'
      - '.github/workflows/poc00-db-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  driver-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mercur
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mercur
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - name: Verify host Bun Postgres connection
        run: bun poc/mercur-runtime/probe-db.mjs
      - name: Verify migration/test DB role privilege
        run: |
          PGCONT="$(docker ps -q --filter ancestor=postgres:15 | head -1)"
          docker exec "$PGCONT" psql -U postgres -d postgres -Atc "select rolcreatedb from pg_roles where rolname='postgres'" | grep -qx t
