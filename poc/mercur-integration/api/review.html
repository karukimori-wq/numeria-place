<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NP 運用確認 PoC</title>
<style>body{background:#F8F7F5;color:#111A32;font:16px system-ui;margin:0;padding:24px}main{max-width:800px;margin:auto}label{display:block;margin-top:16px}input,button{box-sizing:border-box;width:100%;min-height:48px;font:inherit;padding:10px}button{background:#111A32;color:white;border:0;margin-top:16px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:16px}h1{font-size:26px}</style>
<main><h1>運用確認</h1><p>検証環境専用・閲覧のみ。注文の再試行状態と直近50件の履歴を確認できます。</p>
<form id="inspect"><label for="order">注文ID</label><input id="order" required maxlength="200" autocomplete="off">
<label for="token">検証用の運用者Bearerトークン</label><input id="token" type="password" required autocomplete="off">
<p>トークンは保存しません。確認後は入力を消去します。本番ログインは未接続です。</p><button id="load">状態を確認</button></form>
<p id="status" role="status" aria-live="polite">注文IDを入力してください。</p><section id="result" hidden><h2>再試行状態</h2><pre id="queue"></pre><h2>試行履歴</h2><pre id="history"></pre><h2>操作記録</h2><pre id="audit"></pre><p id="more"></p></section></main>
<script>
const form=document.querySelector('#inspect'), status=document.querySelector('#status'), result=document.querySelector('#result'), token=document.querySelector('#token'), button=document.querySelector('#load');
form.addEventListener('submit',async e=>{
e.preventDefault();result.hidden=true;for(const id of ['queue','history','audit'])document.getElementById(id).textContent='';
button.disabled=true;status.textContent='確認中…';
const bearer=token.value;token.value='';
try{
const r=await fetch('/np-ops/retries/'+encodeURIComponent(document.querySelector('#order').value.trim()),{headers:{Authorization:'Bearer '+bearer},cache:'no-store',credentials:'omit',redirect:'error'});
if(!r.ok){status.textContent=({401:'認証が必要です。',403:'閲覧権限がありません。',404:'注文が見つかりません。'})[r.status]||'確認できませんでした。再試行してください。';return;}
const d=await r.json();for(const id of ['queue','history','audit'])document.getElementById(id).textContent=JSON.stringify(d[id],null,2);
document.querySelector('#more').textContent=d.history_has_more||d.audit_has_more?'直近50件のみ表示しています。続きの閲覧は未対応です。':'取得した履歴をすべて表示しています。';
result.hidden=false;status.textContent='確認できました。';
}catch{status.textContent='通信に失敗しました。再試行してください。';}finally{button.disabled=false;}
});
</script></html>
